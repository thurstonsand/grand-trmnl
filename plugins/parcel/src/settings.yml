---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data:
polling_verb: get
framework_version: 3.2.0
serverless_language:
refresh_interval_floor:
polling_url: |-
  https://api.parcel.app/external/deliveries/?filter_mode={{ filter_mode }}
  https://api.recollect.net/api/places/{{ recollect_place_id }}/services/1185/events?hide=reminder_only&after={{ "now" | date: "%s" | minus: 86400 | date: "%Y-%m-%d" }}&before={{ "now" | date: "%s" | plus: 1296000 | date: "%Y-%m-%d" }}
polling_headers: api-key={{ api_key }}
polling_body:
id: 257488
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: api_key
  name: Parcel API Key
  field_type: password
- keyname: filter_mode
  name: Filter Mode
  field_type: select
  options:
  - recent
  - active
- keyname: recollect_place_id
  name: ReCollect Place ID
  field_type: string
name: Parcel
description:
refresh_interval: 60
