min_version = "2026.11.1"

[settings]
# hk publishes no Intel macOS build, so no lockfile can cover that platform; locks cover every
# other platform mise locks by default.
lockfile_platforms = ["linux-x64", "linux-x64-musl", "linux-arm64", "linux-arm64-musl", "macos-arm64", "windows-x64"]
# Every tool, and every package mise locks under it, waits 3 days after release, like Renovate.
minimum_release_age = "3d"
ruby.compile = false

[bootstrap.packages]
"apt:firefox-esr" = "latest"
"brew:imagemagick" = { version = "latest", os = "macos/arm64" }
"brew-cask:firefox" = { version = "latest", os = "macos/arm64" }

[hooks]
# Bootstrap installs the locked gems and git hooks after mise installs the tools.
enter = "mise bootstrap --yes --quiet"

[tools]
# trmnl_preview depends on trmnl-liquid, which requires Ruby >= 4.0
ruby = "4.0.10"
node = "26.13.1"
hk = "2.14.0"
"npm:markdownlint-cli2" = "0.24.2"

[env]
BUNDLE_FROZEN = "true"
BUNDLE_PATH = "{{config_root}}/.bundle/gems"
HK_MISE = "1"

[tasks."bundle:install"]
description = "Install the locked Ruby gems"
run = "bundle check || bundle install"
quiet = true

[tasks.bootstrap]
description = "Install git hooks"
depends = ["bundle:install"]
run = "hk install --mise --quiet"
sources = ["mise.toml", "hk.pkl"]
outputs = { auto = true }
quiet = true

[tasks.lint]
description = "Lint"
depends = ["lint:*"]

[tasks."lint:markdown"]
description = "Lint Markdown"
run = "markdownlint-cli2 '**/*.md'"

# Renovate's tasks run under MISE_ENV=renovate, whose mise.renovate.toml overlays Renovate and the
# Node it supports, so its install stays out of every bootstrap and mise both installs and runs it
# on that Node: re2, Renovate's native regex engine, is built for the Node that installs it and
# refuses to load in another, leaving validation on JavaScript RegExp with only a warning. `mise x`
# also puts that Node ahead of a Homebrew one already on PATH.
[tasks."lint:renovate"]
description = "Validate Renovate configuration"
run = "MISE_ENV=renovate mise x -- renovate-config-validator renovate.json"

[tasks.test]
description = "Run tests"
depends = ["bundle:install"]
run = "bundle exec ruby plugins/parcel/test/date_calculation_test.rb"

[tasks.renovate]
description = "Run Renovate"
run = "MISE_ENV=renovate mise x -- env -u BUNDLE_FROZEN -u BUNDLE_PATH renovate"
